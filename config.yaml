# Borges Configuration
environment: development

paths:
  base_dir: ./data

input_files:
  peeringdb: ${paths.input_dir}/peeringdb_dump.json
  whois: ${paths.input_dir}/whois.txt

# Add your OpenAI API key to .env file
api:
  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    temperature: 0.0
    max_retries: 3
    timeout: 30
    vision_model: gpt-4o-mini

scraping:
  html:
    max_workers: 100
    timeout: 30
    user_agent: "Borges AS Inference 1.0"
    retry_attempts: 3
    delay_between_requests: 0.1
  favicon:
    max_workers: 50
    google_favicon_api: "https://t3.gstatic.com/faviconV2"
    api_params:
      client: SOCIAL
      type: FAVICON
      fallback_opts: TYPE,SIZE,URL
      size: 16
    retry_attempts: 3

processing:
  batch_size: 1000
  llm_batch_size: 10
  prompts:
    as_detection: |
      You are analyzing autonomous system (AS) data to identify sibling relationships.
      
      Given the following information about ASN {asn}:
      - AKA field: {aka}
      - Notes field: {notes}
      
      Identify any other ASNs mentioned that might be siblings (operated by the same organization).
      Look for patterns like:
      - "Also operates AS1234"
      - "Same organization as AS5678"
      - "Merged with AS9999"
      - References to other ASNs in the same corporate family
      
      {format_instructions}
    
    favicon_analysis: |
      Analyze these favicon images from different websites and determine if they represent the same organization or brand.
      
      Website URLs: {urls}
      
      Look for:
      - Same logos or brand elements
      - Similar color schemes and design
      - Same company name or abbreviation
      - Related brand families
      
      Return your analysis indicating if these appear to be from the same organization.

output:
  formats:
    default: parquet
    supported: [parquet, json, csv]
  file_patterns: {}

logging:
  level: INFO
  format: structured
  log_dir: ./logs
  modules: {}

pipeline:
  stages: {}
  checkpoint: {}
  error_handling: {}

performance: {}
development: {}
