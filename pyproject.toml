[project]
name = "borges"
dynamic = ["version"]
description = "AS-to-Organization mapping: infer sibling Autonomous Systems from WHOIS, PeeringDB and web signals (IMC 2025)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Carlos Selmo"},
    {name = "Esteban Carisimo"},
    {name = "Fabian E. Bustamante"},
    {name = "J. Ignacio Alvarez-Hamelin"},
]
keywords = ["network", "autonomous-systems", "peeringdb", "as2org", "as-to-organization", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.1.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "tldextract>=5.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "httpx>=0.25.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "black>=26.0.0,<27",  # pinned major: CI checks formatting
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0",
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://nu-aqualab.github.io/borges-website/"
Repository = "https://github.com/NU-AquaLab/borges"
Paper = "https://estcarisimo.github.io/assets/pdf/papers/2025-IMC-borges.pdf"

[project.scripts]
borges = "borges.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/borges/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/borges"]

# The default configuration (paper prompts, blocklists, PeeringDB exclusions)
# and the reference favicons ship inside the package; see borges/resources.py
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "borges/defaults/config.yaml"
"data/reference/negative_samples" = "borges/defaults/negative_samples"

[tool.hatch.build.targets.sdist]
include = [
    "src/borges",
    "tests",
    "scripts",
    "docs",
    "config.yaml",
    "data/reference",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=borges --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["src/borges"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]