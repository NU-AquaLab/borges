name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# No LLM API key is used anywhere in CI: tests never call a real provider.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (syntax errors and undefined names)
      run: ruff check src tests scripts --select E9,F63,F7,F82

    - name: Format check with black
      run: black --check --diff src/ tests/

    - name: Type check with mypy (informational, not yet enforced)
      continue-on-error: true
      run: mypy src/borges

    - name: Test with pytest
      run: pytest tests/ --cov=borges --cov-report=term-missing
