name: Docs

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build the site (strict)
      run: |
        python -m pip install --upgrade pip
        pip install "mkdocs-material>=9.5,<10"
        mkdocs build

    - uses: actions/upload-pages-artifact@v3
      if: github.event_name != 'pull_request'
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
